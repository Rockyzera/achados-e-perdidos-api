spring.application.name=achados-e-perdidos

# PostgreSQL local. Defina DB_USERNAME e DB_PASSWORD no ambiente antes de iniciar.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_achados_e_perdidos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Em desenvolvimento, cria/atualiza as tabelas a partir das entidades JPA.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
